name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach files to (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_python: python3

      - name: Set version from tag
        run: |
          VERSION="${TAG#v}"
          if [ "$(node -p "require('./package.json').version")" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
          fi

      - name: Build DMG and ZIP (Apple Silicon + Intel)
        run: npm run release
        env:
          npm_config_python: python3

      - name: Verify signatures
        run: |
          codesign --verify --deep --strict dist/mac-arm64/TermHub.app
          codesign --verify --deep --strict dist/mac/TermHub.app

      - name: Attach to the release
        run: gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
